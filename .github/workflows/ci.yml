name: Packaging

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "CMakeLists.txt"
      - "EditorAssets/**"
      - "Source/**"
      - "Tools/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/**"
      - "CMakeLists.txt"
      - "EditorAssets/**"
      - "Source/**"
      - "Tools/**"

permissions:
  contents: read

jobs:
  package-ubuntu2204:
    name: Package (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        working-directory: Tools
        run: bash Setup.sh

      - name: Build CPack packages
        working-directory: Tools
        run: bash Package.sh

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BrainGenix-ERS-packages-ubuntu2204
          path: Build/Packages/
