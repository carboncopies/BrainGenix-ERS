services:
  kafka:
    image: apache/kafka:4.2.0
    container_name: ers-kafka-sandbox
    hostname: kafka
    ports:
      - "9092:9092"
    volumes:
      - ./schemas:/workspace/schemas:ro
      - ./messages:/workspace/messages:ro
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
